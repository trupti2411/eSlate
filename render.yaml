# Render Blueprint — declarative deploy spec read by Render's "New Blueprint" flow.
# Two services + one database, all on free tier:
#
#   eslate-api        Web service (Docker, FrankenPHP) — Laravel API
#   eslate-frontend   Static site — React/Vite build
#   eslate-db         Managed Postgres (free tier auto-expires after 90 days)
#
# Auto-deploys on every push to the `trupti-dev` branch.

services:
  # ── Laravel API ─────────────────────────────────────────────────────────────
  - type: web
    name: eslate-api
    runtime: docker
    repo: https://github.com/trupti2411/eSlate
    branch: trupti-dev
    region: oregon
    plan: free
    healthCheckPath: /healthz
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_KEY
        generateValue: true          # Render generates a 32-char key once and pins it
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://eslate-api.onrender.com
      - key: LOG_CHANNEL
        value: stderr                # Render captures stderr as service logs
      - key: DB_CONNECTION
        value: pgsql
      # Laravel 11's config/database.php reads `url` from env('DB_URL'),
      # not DATABASE_URL. Use the canonical Laravel name.
      - key: DB_URL
        fromDatabase:
          name: eslate-db
          property: connectionString
      - key: SANCTUM_STATEFUL_DOMAINS
        value: dev.eslate.com.au
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

  # ── React/Vite frontend ─────────────────────────────────────────────────────
  - type: web
    name: eslate-frontend
    runtime: static
    repo: https://github.com/trupti2411/eSlate
    branch: trupti-dev
    buildCommand: npm ci && npx vite build
    staticPublishPath: ./dist/public
    pullRequestPreviewsEnabled: false
    envVars:
      # Read at vite-build time; baked into the JS bundle.
      - key: VITE_API_BASE
        value: https://eslate-api.onrender.com
    # SPA rewrite — every unmatched path falls back to index.html so
    # wouter / react-router can handle it client-side.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ── Managed Postgres ──────────────────────────────────────────────────────────
databases:
  - name: eslate-db
    plan: free
    databaseName: eslate
    region: oregon
