---
deployment:
  tasks:
    - export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
    - echo "=== BUILD START: $(date) ==="
    - echo "=== PWD: $(pwd) ==="
    - echo "=== NODE: $(node --version) NPM: $(npm --version) ==="
    - npm install --production 2>&1
    - echo "=== npm install done, exit: $? ==="
    - npm run build 2>&1
    - echo "=== npm build done, exit: $? ==="
    - echo "=== dist/public contents: ===" && ls dist/public/ 2>&1
    - echo "BUILD_TIMESTAMP=$(date)" > dist/public/build-test.txt 2>&1
    - npm run db:push 2>&1
    - npm run db:seed 2>&1
    - pkill -f "node.*dist/index" 2>/dev/null || true
    - sleep 1
    - export $(cat .env | grep -v '^#' | grep '=' | xargs) 2>/dev/null; PORT=3000 NODE_ENV=production nohup node dist/index.js >> ~/eslate-server.log 2>&1 &
    - sleep 2
    - echo "Deployment complete. Server starting on port 3000."
