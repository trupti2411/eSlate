---
deployment:
  tasks:
    - export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
    - echo "START=$(date)" > $HOME/public_html/dev.eslate.com.au/deploy-status.txt 2>&1
    - mkdir -p $HOME/public_html/dev.eslate.com.au 2>&1
    - cp -r dist/public/. $HOME/public_html/dev.eslate.com.au/ 2>&1
    - set -a; . ./.env 2>/dev/null; set +a; echo "PATH_AFTER_ENV=$PATH" >> $HOME/public_html/dev.eslate.com.au/deploy-status.txt 2>&1
    - set -a; . ./.env 2>/dev/null; set +a; which node >> $HOME/public_html/dev.eslate.com.au/deploy-status.txt 2>&1 || echo "no node after env" >> $HOME/public_html/dev.eslate.com.au/deploy-status.txt 2>&1
    - set -a; . ./.env 2>/dev/null; set +a; node --version >> $HOME/public_html/dev.eslate.com.au/deploy-status.txt 2>&1 || echo "node failed after env" >> $HOME/public_html/dev.eslate.com.au/deploy-status.txt 2>&1
    - ls $HOME/nodevenv 2>&1 >> $HOME/public_html/dev.eslate.com.au/deploy-status.txt || echo "no nodevenv dir" >> $HOME/public_html/dev.eslate.com.au/deploy-status.txt 2>&1
    - ls $HOME/.nvm/versions 2>&1 >> $HOME/public_html/dev.eslate.com.au/deploy-status.txt || echo "no nvm" >> $HOME/public_html/dev.eslate.com.au/deploy-status.txt 2>&1
    - echo "ALL_DONE=$(date)" >> $HOME/public_html/dev.eslate.com.au/deploy-status.txt 2>&1
