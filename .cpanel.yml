---
deployment:
  tasks:
    - export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
    - echo "START=$(date)" > $HOME/public_html/dev.eslate.com.au/deploy-status.txt 2>&1
    - mkdir -p $HOME/public_html/dev.eslate.com.au 2>&1
    - cp -r dist/public/. $HOME/public_html/dev.eslate.com.au/ 2>&1
    - which npm >> $HOME/public_html/dev.eslate.com.au/deploy-status.txt 2>&1 || echo "npm not found" >> $HOME/public_html/dev.eslate.com.au/deploy-status.txt 2>&1
    - npm --version >> $HOME/public_html/dev.eslate.com.au/deploy-status.txt 2>&1 || echo "npm failed" >> $HOME/public_html/dev.eslate.com.au/deploy-status.txt 2>&1
    - find /usr /opt /home/zk3vhefl1psj -name "node" -type f -executable 2>/dev/null | head -5 >> $HOME/public_html/dev.eslate.com.au/deploy-status.txt 2>&1
    - find /usr /opt /home/zk3vhefl1psj -name "npm" -type f -executable 2>/dev/null | head -5 >> $HOME/public_html/dev.eslate.com.au/deploy-status.txt 2>&1
    - echo "ALL_DONE=$(date)" >> $HOME/public_html/dev.eslate.com.au/deploy-status.txt 2>&1
