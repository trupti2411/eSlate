---
deployment:
  tasks:
    - export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
    - echo "START=$(date)" > $HOME/public_html/dev.eslate.com.au/deploy-status.txt 2>&1
    - mkdir -p $HOME/public_html/dev.eslate.com.au 2>&1
    - cp -r dist/public/. $HOME/public_html/dev.eslate.com.au/ 2>&1
    - echo "COPY_DONE=$(date)" >> $HOME/public_html/dev.eslate.com.au/deploy-status.txt 2>&1
    - which node >> $HOME/public_html/dev.eslate.com.au/deploy-status.txt 2>&1 || echo "node not in PATH" >> $HOME/public_html/dev.eslate.com.au/deploy-status.txt 2>&1
    - node --version >> $HOME/public_html/dev.eslate.com.au/deploy-status.txt 2>&1 || echo "node --version failed" >> $HOME/public_html/dev.eslate.com.au/deploy-status.txt 2>&1
    - ls /opt/alt/*/bin/node >> $HOME/public_html/dev.eslate.com.au/deploy-status.txt 2>&1 || echo "no node in /opt/alt" >> $HOME/public_html/dev.eslate.com.au/deploy-status.txt 2>&1
    - pkill -f "node.*dist/index" 2>/dev/null || true
    - echo "NODE_START=$(date)" > $HOME/public_html/dev.eslate.com.au/server-log.txt 2>&1
    - set -a; . ./.env 2>/dev/null; set +a; PORT=3000 NODE_ENV=production node dist/index.js >> $HOME/public_html/dev.eslate.com.au/server-log.txt 2>&1 & echo "NODE_PID=$!" >> $HOME/public_html/dev.eslate.com.au/deploy-status.txt 2>&1
    - echo "ALL_DONE=$(date)" >> $HOME/public_html/dev.eslate.com.au/deploy-status.txt 2>&1
