# cPanel Git Version Control deploy spec.
# Triggered by clicking "Update from Remote" → "Deploy HEAD" in cPanel.
#
# Uses $HOME and $DOCUMENT_ROOT env vars cPanel injects at deploy time —
# no hardcoded usernames, so this file stays clean for git.
#
# Targets two subdomains under public_html/:
#   public_html/api.dev.eslate.com.au/         Laravel app root (docroot points to /public)
#   public_html/dev.eslate.com.au/             React static (built locally, optional)

---
deployment:
  tasks:
    # ── Resolve paths ─────────────────────────────────────────────────────────
    - export DEPLOY_API=$HOME/public_html/api.dev.eslate.com.au
    - export DEPLOY_FRONT=$HOME/public_html/dev.eslate.com.au
    - export PHP=/opt/cpanel/ea-php83/root/usr/bin/php

    # ── Sync Laravel API ──────────────────────────────────────────────────────
    # Use rsync-style copy that excludes large dirs we don't want on prod
    # (vendor/ rebuilt below; node_modules/ never needed server-side; .env
    # MUST be preserved if it already exists on the server).
    - /bin/mkdir -p $DEPLOY_API
    - /bin/cp -R api/. $DEPLOY_API/
    # Restore the .env if the deploy clobbered it (first deploy: file just
    # doesn't exist yet — keep going).
    - test -f $DEPLOY_API/.env || /bin/cp $DEPLOY_API/.env.production.template $DEPLOY_API/.env

    # ── Composer install ──────────────────────────────────────────────────────
    # cPanel ships composer at /opt/cpanel/composer/bin/composer on most plans;
    # fall back to a local copy if not.
    - cd $DEPLOY_API && (which composer && composer install --no-dev --optimize-autoloader --no-interaction || $PHP /opt/cpanel/composer/bin/composer install --no-dev --optimize-autoloader --no-interaction) 2>&1 || true

    # ── Laravel maintenance ───────────────────────────────────────────────────
    - cd $DEPLOY_API && $PHP artisan migrate --force 2>&1 || true
    - cd $DEPLOY_API && $PHP artisan db:seed --force 2>&1 || true
    - cd $DEPLOY_API && $PHP artisan config:cache 2>&1 || true
    - cd $DEPLOY_API && $PHP artisan route:cache 2>&1 || true
    - cd $DEPLOY_API && $PHP artisan storage:link 2>&1 || true

    # ── Storage perms ─────────────────────────────────────────────────────────
    - /bin/chmod -R 775 $DEPLOY_API/storage $DEPLOY_API/bootstrap/cache 2>&1 || true

    # ── React frontend (only if a pre-built dist/public/ is committed) ───────
    # We do NOT run `npm run build` here because cPanel servers typically
    # lack Node. Build LOCALLY with `npx vite build`, then commit the output
    # (or upload via FTP separately).
    - test -d dist/public && /bin/mkdir -p $DEPLOY_FRONT && /bin/cp -R dist/public/. $DEPLOY_FRONT/ 2>&1 || true

    # ── Deploy marker ─────────────────────────────────────────────────────────
    - date > $DEPLOY_API/storage/last_deploy.txt 2>&1 || true
